name: Phase 56 button-system QA
on:
  push:
    branches:
      - phase-56-dashboard-action-system
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/phase56-build.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable package manager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript audit (legacy failures are reported)
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      - name: Production frontend build
        run: pnpm build
