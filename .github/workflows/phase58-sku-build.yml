name: Phase 58 automatic SKU QA
on:
  push:
    branches: [phase-58-automatic-product-sku]
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/20261017000300_automatic_product_sku.sql'
      - '.github/workflows/phase58-sku-build.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Existing TypeScript audit (nonblocking baseline debt)
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      - name: Production Vite build
        run: pnpm build
