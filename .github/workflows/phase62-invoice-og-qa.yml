name: Phase 62 Invoice + OG Domain QA
on:
  push:
    branches: [phase-62-inline-invoice-discounts-social-domain]
  pull_request:
    paths:
      - 'src/**'
      - 'infra/og-product-routing/**'
      - 'scripts/qa-invoice-print.cjs'
      - 'scripts/qa-product-og-route.mjs'
      - '.github/workflows/phase62-invoice-og-qa.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Production frontend build
        run: pnpm build
      - name: Legacy TypeScript audit (reported, currently nonblocking)
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      - name: Test original-domain crawler route (not deployed)
        run: node scripts/qa-product-og-route.mjs
      - name: Compile invoice HTML renderer
        run: pnpm dlx esbuild@0.25.12 src/domain/invoicePrint.ts --bundle --platform=node --format=cjs --outfile=/tmp/chefmujahed-invoice-print.cjs --alias:@=./src
      - name: Test revised invoice markup and customer privacy
        run: node scripts/qa-invoice-print.cjs
      - name: Check short and adjusted PDFs are one A4 page
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          command -v pdfinfo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          for kind in short business adjusted long; do
            "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-pdf-header-footer \
              --print-to-pdf="/tmp/cm-invoice-$kind.pdf" "file:///tmp/cm-invoice-$kind.html" >/tmp/cm-chrome.log 2>&1
            pages="$(pdfinfo "/tmp/cm-invoice-$kind.pdf" | awk '/^Pages:/ {print $2}')"
            echo "Invoice $kind => $pages pages"
            if [[ "$kind" != "long" && "$pages" -ne 1 ]]; then echo "Extra A4 page" >&2; exit 1; fi
            if [[ "$kind" == "long" && "$pages" -lt 2 ]]; then echo "Long invoice missing pages" >&2; exit 1; fi
            pdftotext -f "$pages" -l "$pages" "/tmp/cm-invoice-$kind.pdf" - | grep -q 'INV-QA-001' || { echo "Trailing blank or missing footer" >&2; exit 1; }
          done
