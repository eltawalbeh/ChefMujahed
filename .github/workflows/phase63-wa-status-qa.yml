name: Phase 63 WhatsApp and Orders
on:
  push:
    branches: [phase-63-whatsapp-phone-order-status]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/qa-phone-whatsapp.cjs'
      - 'supabase/migrations/20261017000800_manager_manual_order_progress.sql'
      - '.github/workflows/phase63-wa-status-qa.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Compile phone parser
        run: pnpm dlx esbuild@0.25.12 src/lib/phone.ts --bundle --platform=node --format=cjs --outfile=/tmp/chef-mujahed-phone.cjs --alias:@=./src
      - name: Compile WhatsApp messages
        run: pnpm dlx esbuild@0.25.12 src/lib/whatsapp.ts --bundle --platform=node --format=cjs --outfile=/tmp/chef-mujahed-wa.cjs --alias:@=./src --define:import.meta.env.VITE_WHATSAPP_NUMBER='"0791234567"'
      - name: Verify international phone links and messages
        run: node scripts/qa-phone-whatsapp.cjs
      - name: Report existing TS debt (nonblocking)
        continue-on-error: true
        run: pnpm exec tsc --noEmit
